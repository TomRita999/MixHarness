[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mixharness"
version = "0.7.0"
description = "使用 Gemini 和 OpenAI 协作开发、验证和撰写报告的本地工作台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "openai[realtime]>=3.8,<4",
    "httpx2>=2.12,<3",
    "google-genai>=3.0,<4",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.10,<3",
    "filelock>=3.16,<4",
    "markdown-it-py>=3,<5",
    "PySide6-Essentials>=6.8,<7",
    "qasync>=0.28,<0.29",
    "pywinpty>=2,<4; sys_platform == 'win32'",
    "prompt-toolkit>=3.0.48,<4",
    "python-frontmatter>=1.1,<2",
    "tiktoken>=0.9,<1",
]

[project.scripts]
mixharness = "mixharness.cli:main"

[project.gui-scripts]
mixharness-desktop = "mixharness.desktop_main:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.12,<7", "pillow>=11"]

[tool.setuptools.packages.find]
include = ["mixharness*"]

[tool.setuptools.package-data]
mixharness = ["static/*", "resources/*"]
